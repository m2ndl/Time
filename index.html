<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كم الوقت المتوقع للوصول للمستوى الذي تريده؟</title>
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #2C3639, #3F4E4F);
      color: #DCD7C9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cefr-calculator {
      max-width: 700px;
      width: 90%;
      margin: 40px auto;
      border-radius: 20px;
      padding: 40px;
      background: rgba(44, 54, 57, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(162, 123, 92, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.8s ease;
    }

    h2 {
      text-align: center;
      color: #A27B5C;
      font-weight: 800;
      font-size: 32px;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    p {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #E8E5DF;
    }

    select, input[type="number"], button, input[type="range"] {
      width: 100%;
      padding: 15px;
      margin-bottom: 18px;
      border-radius: 12px;
      font-size: 18px;
      background: #3F4E4F;
      color: #F5F3EE;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    select:focus, input[type="number"]:focus {
      outline: none;
      border: 1px solid #A27B5C;
      box-shadow: 0 0 10px rgba(162, 123, 92, 0.6);
    }

    button {
      font-size: 22px;
      font-weight: 700;
      color: #2C3639;
      background: linear-gradient(135deg, #DCD7C9, #BFB8A9);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(162, 123, 92, 0.5);
    }

    input[type="range"] {
      accent-color: #A27B5C;
      cursor: pointer;
    }

    .motivation-labels {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      color: #DCD7C9;
      font-weight: 600;
      margin-top: -5px;
    }

    #results {
      margin-top: 30px;
      text-align: center;
      font-size: 20px;
      padding: 25px;
      border-radius: 16px;
      background: linear-gradient(135deg, #3F4E4F, #2C3639);
      color: #F5F3EE;
      display: none;
      animation: fadeIn 0.7s ease;
    }

    #results div {
      margin-bottom: 20px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="cefr-calculator">
    <h2>كم الوقت المتوقع للوصول للمستوى الذي تريده؟</h2>

    <!-- Start Level -->
    <div>
      <p>🔹 اختر مستوى البداية (مستواك الحالي):</p>
      <select id="start-level">
        <option value="A1">A1 - مبتدئ</option>
        <option value="A2">A2 - ما قبل المتوسط</option>
        <option value="B1">B1 - متوسط</option>
        <option value="B2">B2 - فوق المتوسط</option>
        <option value="C1">C1 - متقدم</option>
        <option value="C2">C2 - متمكن</option>
      </select>
    </div>

    <!-- Target Level -->
    <div>
      <p>🔹 اختر مستوى الهدف (الذي تريد الوصول إليه):</p>
      <select id="target-level">
        <option value="A2">A2 - ما قبل المتوسط</option>
        <option value="B1">B1 - متوسط</option>
        <option value="B2">B2 - فوق المتوسط</option>
        <option value="C1">C1 - متقدم</option>
        <option value="C2">C2 - متمكن</option>
      </select>
    </div>

    <!-- Weekly Hours -->
    <div>
      <p>🔹 أدخل عدد ساعات الدراسة الأسبوعية:</p>
      <input type="number" id="weekly-hours" value="10" min="1">
    </div>

    <!-- Motivation Level -->
    <div>
      <p>🔹 حدد مستوى الحافز لديك:</p>
      <input type="range" id="motivation" min="1" max="3" value="2" step="1">
      <div class="motivation-labels">
        <span>منخفض</span>
        <span>متوسط</span>
        <span>مرتفع</span>
      </div>
    </div>

    <!-- Button -->
    <button onclick="calculateCEFR()">احسب الآن</button>

    <!-- Results -->
    <div id="results"></div>
  </div>

  <script>
    const GLH_LOOKUP = {
      "A1-A2": 150,
      "A2-B1": 240,
      "B1-B2": 260,
      "B2-C1": 300,
      "C1-C2": 400,
    };

    function calculateCEFR() {
      try {
        const startLevel = document.getElementById("start-level").value;
        const targetLevel = document.getElementById("target-level").value;
        const weeklyHours = parseFloat(document.getElementById("weekly-hours").value);
        const motivation = parseInt(document.getElementById("motivation").value);

        const levels = ["A1", "A2", "B1", "B2", "C1", "C2"];
        const startIndex = levels.indexOf(startLevel);
        const targetIndex = levels.indexOf(targetLevel);

        if (targetIndex <= startIndex) {
          document.getElementById("results").style.display = "block";
          document.getElementById("results").innerHTML =
            "<span style='color: red; font-size: 22px; font-weight: 700;'>يجب أن يكون مستوى الهدف أعلى من مستوى البداية.</span>";
          return;
        }

        // Calculate Total Maximum GLH
        let totalMaxGLH = 0;
        for (let i = startIndex; i < targetIndex; i++) {
          const key = `${levels[i]}-${levels[i + 1]}`;
          totalMaxGLH += GLH_LOOKUP[key];
        }

        // Adjust GLH based on motivation
        const motivationFactor = motivation === 3 ? 0.8 : motivation === 2 ? 1 : 1.2;
        const adjustedMaxGLH = Math.round(totalMaxGLH * motivationFactor);

        // Calculate weeks and months
        const weeks = Math.ceil(adjustedMaxGLH / weeklyHours);
        const totalMonths = Math.ceil(weeks / 4.3);

        // Convert months into years and months
        const years = Math.floor(totalMonths / 12);
        const remainingMonths = totalMonths % 12;

        // Handle Arabic pluralization for months
        const monthLabel = (remainingMonths > 2 || remainingMonths === 0) ? "أشهر" : "شهر";

        const formattedTime =
          years > 0
            ? `${years} سنة${remainingMonths > 0 ? ` و${remainingMonths} ${monthLabel}` : ""}`
            : `${totalMonths} ${monthLabel}`;

        // Display results
        document.getElementById("results").style.display = "block";
        document.getElementById("results").innerHTML = `
          <div style="background: #A27B5C; border-radius: 12px; padding: 20px; color: #2C3639; font-size: 26px; font-weight: 700; margin-bottom: 20px;">
            📚 الساعات المطلوبة: <span style="color: #FFFFFF;">${adjustedMaxGLH} ساعة</span>
          </div>
          <div style="background: #A27B5C; border-radius: 12px; padding: 20px; color: #2C3639; font-size: 26px; font-weight: 700;">
            🕒 الوقت المقدر: <span style="color: #FFFFFF;">${formattedTime}</span>
          </div>
          <small style="color: gray; display: block; margin-top: 20px;">هذه مجرد تقديرات وقد تختلف النتائج بناءً على ظروفك الشخصية.</small>
        `;
      } catch (error) {
        console.error("An error occurred:", error);
        alert("حدث خطأ أثناء الحساب. الرجاء المحاولة مرة أخرى.");
      }
    }
  </script>
</body>
</html>
