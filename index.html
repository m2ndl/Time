<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كم الوقت المتوقع للوصول للمستوى الذي تريده؟</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A2F3A">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حاسبة الوقت">
<meta property="og:type" content="website">
<meta property="og:site_name" content="لغتي الثانية">
<meta property="og:title" content="كم تحتاج وقت حتى تتعلم الإنجليزية؟">
<meta property="og:description" content="اختر مستواك الحالي والمستوى الذي تريده وساعات دراستك في الأسبوع، واحصل على تقدير للمدة مبني على الأبحاث.">
<meta property="og:url" content="https://m2ndl.github.io/Time/">
<meta property="og:image" content="https://m2ndl.github.io/Time/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ar_SA">
<meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;800&family=Archivo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      background: #EEF4F4;
      color: #0A2F3A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cefr-calculator {
      max-width: 700px;
      width: 90%;
      margin: 40px auto;
      border-radius: 20px;
      padding: 40px;
      background: #FFFFFF;
      border: 1px solid rgba(10, 47, 58, 0.13);
      box-shadow: 0 18px 40px rgba(10, 47, 58, 0.10);
      animation: fadeUp 0.8s ease;
    }

    h2 {
      text-align: center;
      font-family: 'Alexandria', Tahoma, sans-serif;
      background: #0A2F3A;
      color: #F1D9B3;
      font-weight: 800;
      font-size: 32px;
      margin: -40px -40px 35px;
      padding: 32px 40px;
      border-radius: 19px 19px 0 0;
      line-height: 1.5;
      letter-spacing: 0;
    }

    p {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #0A2F3A;
    }

    select, input[type="number"], button, input[type="range"] {
      width: 100%;
      padding: 15px;
      margin-bottom: 18px;
      border-radius: 12px;
      font-size: 18px;
      font-family: 'Archivo', 'IBM Plex Sans Arabic', Tahoma, sans-serif;
      font-weight: 600;
      background: #FFFFFF;
      color: #0A2F3A;
      border: 1px solid rgba(29, 107, 120, 0.75);
      transition: all 0.3s ease;
    }

    select:focus, input[type="number"]:focus {
      outline: none;
      border: 1px solid #1D6B78;
      box-shadow: 0 0 0 3px rgba(29, 107, 120, 0.25);
    }

    button {
      font-size: 22px;
      font-family: 'Alexandria', Tahoma, sans-serif;
      font-weight: 600;
      color: #FFFFFF;
      background: #A35E33;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #8F5129;
      box-shadow: 0 8px 18px rgba(163, 94, 51, 0.30);
    }

    button:focus-visible {
      outline: 3px solid #1D6B78;
      outline-offset: 3px;
    }

    input[type="range"] {
      accent-color: #1D6B78;
      cursor: pointer;
    }

    .motivation-labels {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      color: rgba(10, 47, 58, 0.72);
      font-weight: 600;
      margin-top: -5px;
    }

    #results {
      margin-top: 30px;
      text-align: center;
      font-size: 20px;
      padding: 25px;
      border-radius: 16px;
      background: #EEF4F4;
      border: 1px solid rgba(10, 47, 58, 0.13);
      color: #0A2F3A;
      display: none;
      animation: fadeIn 0.7s ease;
    }

    #results div {
      margin-bottom: 20px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="cefr-calculator">
    <h2>كم الوقت المتوقع للوصول للمستوى الذي تريده؟</h2>

    <!-- Start Level -->
    <div>
      <p>🔹 اختر مستوى البداية (مستواك الحالي):</p>
      <select id="start-level">
        <option value="A1">A1 - مبتدئ</option>
        <option value="A2">A2 - ما قبل المتوسط</option>
        <option value="B1">B1 - متوسط</option>
        <option value="B2">B2 - فوق المتوسط</option>
        <option value="C1">C1 - متقدم</option>
        <option value="C2">C2 - متمكن</option>
      </select>
    </div>

    <!-- Target Level -->
    <div>
      <p>🔹 اختر مستوى الهدف (الذي تريد الوصول إليه):</p>
      <select id="target-level">
        <option value="A2">A2 - ما قبل المتوسط</option>
        <option value="B1">B1 - متوسط</option>
        <option value="B2">B2 - فوق المتوسط</option>
        <option value="C1">C1 - متقدم</option>
        <option value="C2">C2 - متمكن</option>
      </select>
    </div>

    <!-- Weekly Hours -->
    <div>
      <p>🔹 أدخل عدد ساعات الدراسة الأسبوعية:</p>
      <input type="number" id="weekly-hours" value="10" min="1">
    </div>

    <!-- Motivation Level -->
    <div>
      <p>🔹 حدد مستوى الحافز لديك:</p>
      <input type="range" id="motivation" min="1" max="3" value="2" step="1">
      <div class="motivation-labels">
        <span>منخفض</span>
        <span>متوسط</span>
        <span>مرتفع</span>
      </div>
    </div>

    <!-- Button -->
    <button onclick="calculateCEFR()">احسب الآن</button>

    <!-- Results -->
    <div id="results"></div>
  </div>

  <script>
    const GLH_LOOKUP = {
      "A1-A2": 150,
      "A2-B1": 240,
      "B1-B2": 260,
      "B2-C1": 300,
      "C1-C2": 400,
    };

    function calculateCEFR() {
      try {
        const startLevel = document.getElementById("start-level").value;
        const targetLevel = document.getElementById("target-level").value;
        const weeklyHours = parseFloat(document.getElementById("weekly-hours").value);
        const motivation = parseInt(document.getElementById("motivation").value);

        const levels = ["A1", "A2", "B1", "B2", "C1", "C2"];
        const startIndex = levels.indexOf(startLevel);
        const targetIndex = levels.indexOf(targetLevel);

        if (targetIndex <= startIndex) {
          document.getElementById("results").style.display = "block";
          document.getElementById("results").innerHTML =
            "<span style='color: #B3261E; font-size: 22px; font-weight: 700;'>يجب أن يكون مستوى الهدف أعلى من مستوى البداية.</span>";
          return;
        }

        // Calculate Total Maximum GLH
        let totalMaxGLH = 0;
        for (let i = startIndex; i < targetIndex; i++) {
          const key = `${levels[i]}-${levels[i + 1]}`;
          totalMaxGLH += GLH_LOOKUP[key];
        }

        // Adjust GLH based on motivation
        const motivationFactor = motivation === 3 ? 0.8 : motivation === 2 ? 1 : 1.2;
        const adjustedMaxGLH = Math.round(totalMaxGLH * motivationFactor);

        // Calculate weeks and months
        const weeks = Math.ceil(adjustedMaxGLH / weeklyHours);
        const totalMonths = Math.ceil(weeks / 4.3);

        // Convert months into years and months
        const years = Math.floor(totalMonths / 12);
        const remainingMonths = totalMonths % 12;

        // Handle Arabic pluralization for months
        const monthLabel = (remainingMonths > 2 || remainingMonths === 0) ? "أشهر" : "شهر";

        const formattedTime =
          years > 0
            ? `${years} سنة${remainingMonths > 0 ? ` و${remainingMonths} ${monthLabel}` : ""}`
            : `${totalMonths} ${monthLabel}`;

        // Display results
        document.getElementById("results").style.display = "block";
        document.getElementById("results").innerHTML = `
          <div style="background: #FFFFFF; border: 1px solid rgba(10, 47, 58, 0.13); box-shadow: 0 4px 14px rgba(10, 47, 58, 0.06); border-radius: 12px; padding: 20px; color: #0A2F3A; font-size: 26px; font-weight: 700; margin-bottom: 20px;">
            📚 الساعات المطلوبة: <span style="color: #1D6B78;">${adjustedMaxGLH} ساعة</span>
          </div>
          <div style="background: #FFFFFF; border: 1px solid rgba(10, 47, 58, 0.13); box-shadow: 0 4px 14px rgba(10, 47, 58, 0.06); border-radius: 12px; padding: 20px; color: #0A2F3A; font-size: 26px; font-weight: 700;">
            🕒 الوقت المقدر: <span style="color: #1D6B78;">${formattedTime}</span>
          </div>
          <small style="color: rgba(10, 47, 58, 0.72); display: block; margin-top: 20px;">هذه مجرد تقديرات وقد تختلف النتائج بناءً على ظروفك الشخصية.</small>
        `;
      } catch (error) {
        console.error("An error occurred:", error);
        alert("حدث خطأ أثناء الحساب. الرجاء المحاولة مرة أخرى.");
      }
    }
  </script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});</script>
</body>
</html>
